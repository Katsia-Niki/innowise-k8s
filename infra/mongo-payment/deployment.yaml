apiVersion: apps/v1
kind: Deployment
metadata:
  name: epic-payment-mongo
  namespace: inno
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epic-payment-mongo
  template:
    metadata:
      labels:
        app: epic-payment-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          startupProbe:
            tcpSocket:
              port: 27017
            failureThreshold: 24
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: payment-mongo-pvc
