apiVersion: apps/v1
kind: Deployment
metadata:
  name: epic-order-service
  namespace: inno
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epic-order-service
  template:
    metadata:
      labels:
        app: epic-order-service
    spec:
      containers:
        - name: app
          image: epic-order-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
