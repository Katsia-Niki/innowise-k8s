apiVersion: apps/v1
kind: Deployment
metadata:
  name: epic-user-service
  namespace: inno
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epic-user-service
  template:
    metadata:
      labels:
        app: epic-user-service
    spec:
      containers:
        - name: app
          image: epic-user-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
